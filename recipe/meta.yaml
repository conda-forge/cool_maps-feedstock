{% set name = "cool_maps" %}
{% set version = "1.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/rucool/cool_maps/archive/{{ version }}.tar.gz
  sha256: 8a443886eb6e0d66d293704f4cb6c1693a2313e0d9fafd3e96400e10a8c0db06

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.7
    - pip
    - setuptools
    - versioneer
  run:
    - python >=3.7
    - cartopy
    - matplotlib-base
    - cmocean
    - oceans
    - numpy
    - xarray
    - erddapy

test:
  imports:
    - cool_maps
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/rucool/cool_maps
  summary: 'Wrapper around Cartopy to easily generate nice-looking maps passing just the extent.'
  license: MIT
  license_file: LICENSE
  doc_url: https://cool_maps.readthedocs.io/

extra:
  recipe-maintainers:
    - najascutellatus
    - lnazzaro
    - lgarzio
